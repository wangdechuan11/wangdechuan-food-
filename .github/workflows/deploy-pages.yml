name: Deploy 美食学堂 to GitHub Pages

# 只发布 ordering-h5 这个子目录，仓库里的其他内容不会上线。
on:
  push:
    branches: [main, master]
    paths:
      - 'ordering-h5/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送会取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 站点根目录就是这个文件夹
          path: ordering-h5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
